<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordduellen</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#08295b;min-height:100vh;background:linear-gradient(#1caee9 0%,#62d7f5 36%,#168fc5 72%,#70bf67 100%)}body:before{content:"";position:fixed;inset:38% 0 0;pointer-events:none;background:linear-gradient(155deg,transparent 0 22%,#1679ae55 23% 31%,transparent 32%),linear-gradient(205deg,transparent 0 25%,#0f6f9f55 26% 35%,transparent 36%);opacity:.65}.app{position:relative;width:min(100%,620px);margin:auto;padding:18px 18px calc(28px + env(safe-area-inset-bottom))}h1{text-align:center;font-size:clamp(3rem,13vw,5rem);line-height:.9;margin:12px 0 6px;color:#fff;text-shadow:0 5px 0 #083f7d;letter-spacing:-.06em}.sub{text-align:center;color:#fff;font-weight:850}.card{background:#ffffffee;border-radius:28px;padding:22px;margin:22px 0;box-shadow:0 10px 24px #064a7840}h2{text-align:center}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.choice label{display:flex;align-items:center;justify-content:center;min-height:80px;border:3px solid #d8ebf6;border-radius:20px;padding:12px;font-weight:900;background:#fff}.choice label:has(input:checked){border-color:#16a66b;background:#e9fff3;box-shadow:0 5px 0 #8bd8b4}.choice input{margin-right:8px;accent-color:#16a66b}.btn{width:100%;border:0;border-radius:22px;padding:15px;font-weight:950;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 #0b4770}.primary{background:#2eb676;color:#fff}.secondary{background:#fff;color:#08295b;margin-top:10px}.join{display:flex;gap:9px;margin-top:12px}.join input{min-width:0;flex:1;padding:14px;border:3px solid #b9ddec;border-radius:17px;font-size:16px;font-weight:900;text-transform:uppercase}.hidden{display:none!important}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.pill{background:#fff;border:0;border-radius:22px;padding:13px 8px;text-align:center;font-weight:950;box-shadow:0 4px 10px #07547c28}.pill:last-child{grid-column:1/-1;width:48%;justify-self:center}.turn{text-align:center;background:#8ef09b;border:2px solid #d8ffd8;border-radius:999px;padding:11px;margin:14px auto;font-weight:950;max-width:520px}.room{text-align:center;color:#fff;font-weight:900}.code{font-size:1.45rem;letter-spacing:.14em;background:#fff;color:#1761a1;padding:4px 10px;border-radius:10px}.board{position:relative;width:min(78vw,350px);height:min(78vw,350px);margin:8px auto 20px}.tile{position:absolute;width:23%;aspect-ratio:1;border:3px solid #fff;border-radius:50%;background:#fffaf3;box-shadow:0 7px 0 #c8c4bb,0 12px 20px #07547c35;font-size:clamp(1.55rem,6vw,2.25rem);font-weight:950;transform:translate(-50%,-50%);color:#08295b}.tile.center{width:26%;background:#fffaf3;color:#08295b;box-shadow:0 8px 0 #c8c4bb,0 12px 20px #07547c40;z-index:2}.tile.selected{outline:6px solid #79efa7;background:#eafff0}.p0{left:50%;top:50%}.p1{left:50%;top:10%}.p2{left:84%;top:30%}.p3{left:84%;top:70%}.p4{left:50%;top:90%}.p5{left:16%;top:70%}.p6{left:16%;top:30%}.word{text-align:center;min-height:45px;font-size:1.7rem;font-weight:950;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 #07547c}.msg{text-align:center;min-height:27px;color:#fff;font-weight:900}.actions{display:flex;gap:10px;margin-top:8px}#game{padding-bottom:80px}#game h1{font-size:clamp(2.7rem,10vw,4rem);margin:5px 0 12px}@media(max-width:390px){.choice{grid-template-columns:1fr}.board{width:300px;height:300px}.tile{width:68px}.tile.center{width:78px}}
</style><style id="ordduellen-v3">
html,body{min-height:100%;background:linear-gradient(180deg,#19aee9 0%,#65d8f4 42%,#168fc5 78%,#5ebc70 100%)!important}
body{color:#08295b!important}.app{width:min(100%,620px)!important;padding:14px 18px calc(90px + env(safe-area-inset-bottom))!important}
#game h1,#home h1{color:#fff!important;text-shadow:0 5px 0 #06467f!important}
.stats{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}.pill{background:#fff!important;border:0!important;color:#08295b!important;box-shadow:0 4px 12px #07547c28!important}.pill:last-child{grid-column:1/-1!important;width:50%!important;justify-self:center!important}
.turn{background:#8cef9d!important;color:#08295b!important;border:2px solid #d9ffe1!important}

.board{position:relative!important;width:min(76vw,340px)!important;height:min(76vw,340px)!important;margin:12px auto 22px!important}
.tile,.tile:nth-child(even){position:absolute!important;width:72px!important;height:72px!important;aspect-ratio:1!important;border-radius:50%!important;border:3px solid #fff!important;background:#fffaf3!important;color:#08295b!important;box-shadow:0 6px 0 #c9c5bb,0 10px 18px #07547c35!important;transform:translate(-50%,-50%)!important}
.tile.center{width:82px!important;height:82px!important;background:#fffaf3!important;color:#08295b!important;box-shadow:0 7px 0 #c9c5bb,0 11px 20px #07547c40!important}
.p0{left:50%!important;top:50%!important}.p1{left:50%!important;top:12%!important}.p2{left:83%!important;top:31%!important}.p3{left:83%!important;top:69%!important}.p4{left:50%!important;top:88%!important}.p5{left:17%!important;top:69%!important}.p6{left:17%!important;top:31%!important}.p7{display:none!important}

<body><main class="app"><section id="home"><div class="sparkles">✦ ★ ✦</div><h1>Ordduellen</h1><p class="sub">🔤 Hitta orden · ⚡ Utmana en vän · 🏆 Vinn duellen</p><div class="card"><h2>Hur vill du spela?</h2><div class="choice"><label><input type="radio" name="mode" value="solo" checked> 🎯 Spela själv</label><label><input type="radio" name="mode" value="online"> ⚔️ Spela online</label></div><button id="start" class="btn primary">Starta spel</button><div id="onlineOptions" class="hidden"><button id="create" class="btn secondary">Skapa rum</button><div class="join"><input id="roomCode" maxlength="5" placeholder="RUMSKOD"><button id="join" class="btn primary">Anslut</button></div></div><div id="homeMsg" class="msg"></div></div></section>
<section id="game" class="hidden"><h1 style="font-size:clamp(2.4rem,10vw,4rem);margin-bottom:14px">Ordduellen</h1><div id="roomInfo" class="room hidden">Rum: <span id="code" class="code"></span></div><div class="stats"><span class="pill">Du: <b id="myScore">0</b></span><span class="pill">Motståndare: <b id="otherScore">0</b></span><span class="pill">Möjliga ord: <b id="possibleCount">20+</b></span></div><div id="turn" class="turn"></div><p class="sub">Mittenbokstaven måste användas · minst 4 bokstäver</p><div id="board" class="board"></div><div id="word" class="word"></div><div id="msg" class="msg"></div><div class="actions"><button id="clear" class="btn secondary">Rensa</button><button id="submit" class="btn primary">Lägg ord</button></div><button id="back" class="btn secondary">Till startsidan</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL="https://vihncukhitijhrvgvonw.supabase.co",SB_KEY="sb_publishable_cekFLm639kSdmlifG7YFWw_O-EFse4C",sb=supabase.createClient(SB_URL,SB_KEY);
const puzzles=[{id:10,l:"AKRTSPE",n:20},{id:3,l:"OSKLBAR",n:20},{id:5,l:"ÖGRNSAK",n:20},{id:9,l:"ISKRFTE",n:20},{id:8,l:"ÄFRSKOS",n:20}];let puzzle=null;let letters=[],selected=[],room=null,player=1,channel=null,mode="solo",soloScore=0;
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),clientId=uid();let onlineSelected=false;
document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=()=>{$("onlineOptions").classList.toggle("hidden",x.value!=="online");onlineSelected=x.value==="online"});
function makeLetters(s){const a=[...s],center=a.shift();a.sort(()=>Math.random()-.5);return[center,...a.slice(0,6)]}
function showGame(){ $("home").classList.add("hidden");$("game").classList.remove("hidden");$("possibleCount").textContent=puzzle?puzzle.n:"20+";render()}
function render(){const b=$("board");b.innerHTML="";letters.forEach((l,i)=>{const e=document.createElement("button");e.className="tile p"+i+(i===0?" center":"")+(selected.includes(i)?" selected":"");e.textContent=l;e.disabled=mode==="online"&&(!room||room.status!=="playing"||room.current_player!==player);e.onclick=()=>{selected.includes(i)?selected=selected.filter(x=>x!==i):selected.push(i);render()};b.appendChild(e)});$("word").textContent=selected.map(i=>letters[i]).join("");if(mode==="solo"){$("turn").textContent="Spela fritt";$("myScore").textContent=soloScore;$("otherScore").textContent="–"}else if(room){$("myScore").textContent=player===1?room.host_score:room.guest_score;$("otherScore").textContent=player===1?room.guest_score:room.host_score;$("turn").textContent=room.status==="waiting"?"Väntar på spelare 2…":room.current_player===player?"Din tur":"Motståndarens tur"}}
function pickPuzzle(){puzzle=puzzles[Math.floor(Math.random()*puzzles.length)];return makeLetters(puzzle.l)} function localStart(){mode="solo";letters=pickPuzzle();soloScore=0;selected=[];showGame()}
$("start").onclick=()=>{const v=document.querySelector('input[name=mode]:checked').value;if(v==="solo")localStart();else{$("onlineOptions").classList.remove("hidden");$("homeMsg").textContent="Skapa ett rum eller skriv in en kod."}};
async function createRoom(){mode="online";player=1;letters=pickPuzzle();const code=Math.random().toString(36).slice(2,7).toUpperCase();const {data,error}=await sb.from("ordduellen_rooms").insert({code,host_id:clientId,letters:letters.join("")}).select().single();if(error){$("homeMsg").textContent="Kunde inte skapa rum.";return}room=data;openRoom();showGame()}
async function joinRoom(){const code=$("roomCode").value.trim().toUpperCase();const {data,error}=await sb.from("ordduellen_rooms").select("*").eq("code",code).single();if(error||!data){$("homeMsg").textContent="Rummet hittades inte.";return}if(data.guest_id){$("homeMsg").textContent="Rummet är fullt.";return}player=2;mode="online";const {data:updated,error:e}=await sb.from("ordduellen_rooms").update({guest_id:clientId,status:"playing"}).eq("id",data.id).is("guest_id",null).select().single();if(e||!updated){$("homeMsg").textContent="Kunde inte ansluta.";return}room=updated;letters=[...room.letters];openRoom();showGame()}
function openRoom(){letters=[...room.letters];$("roomInfo").classList.remove("hidden");$("code").textContent=room.code;if(channel)sb.removeChannel(channel);channel=sb.channel("ordduellen-"+room.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"ordduellen_rooms",filter:"id=eq."+room.id},p=>{room=p.new;letters=[...room.letters];selected=[];render()}).subscribe()}
$("create").onclick=createRoom;$("join").onclick=joinRoom;$("clear").onclick=()=>{selected=[];$("msg").textContent="";render()};
$("submit").onclick=async()=>{const w=selected.map(i=>letters[i]).join("").toLowerCase();if(!selected.includes(0)){$("msg").textContent="Mittenbokstaven måste vara med.";return}if(w.length<4){$("msg").textContent="Minst 4 bokstäver.";return}if(mode==="solo"){soloScore++;selected=[];$("msg").textContent=w.toUpperCase()+" registrerat";render();return}if(!room||room.current_player!==player)return;const patch={last_word:w,current_player:player===1?2:1};if(player===1)patch.host_score=room.host_score+1;else patch.guest_score=room.guest_score+1;const {data,error}=await sb.from("ordduellen_rooms").update(patch).eq("id",room.id).eq("current_player",player).select().single();if(error){$("msg").textContent="Kunde inte lägga ord.";return}room=data;selected=[];$("msg").textContent=w.toUpperCase()+" lagt. Turen går över.";render()};
$("back").onclick=()=>{if(channel){sb.removeChannel(channel);channel=null}$("game").classList.add("hidden");$("home").classList.remove("hidden");$("roomInfo").classList.add("hidden")};
</script></body></html>
