<!doctype html>
<html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordduellen</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3efe7;color:#25221e;min-height:100vh}.app{width:min(94vw,620px);margin:auto;padding:28px 16px 50px}h1{text-align:center;font-size:clamp(2.5rem,10vw,4.5rem);margin:0}.sub{text-align:center;color:#70695f;margin:2px 0 20px}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #d8cebf;border-radius:999px;padding:8px 14px;font-weight:700}.hint{text-align:center;font-size:.9rem;color:#70695f;margin:12px 0 4px}.board{position:relative;width:min(88vw,430px);aspect-ratio:1;margin:4px auto 8px}.tile{position:absolute;width:22%;aspect-ratio:1;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 12px #0002;font-size:clamp(1.6rem,7vw,2.5rem);font-weight:850;cursor:pointer;transform:translate(-50%,-50%);transition:.12s}.tile.selected{outline:4px solid #25221e;transform:translate(-50%,-50%) scale(.94)}.tile.center{width:25%;background:#25221e;color:#fff;box-shadow:0 5px 16px #0004}.tile.center::after{content:"MÅSTE MED";position:absolute;left:50%;top:72%;transform:translateX(-50%);font-size:.43rem;letter-spacing:.08em;white-space:nowrap}.p0{left:50%;top:50%}.p1{left:50%;top:13%}.p2{left:76%;top:24%}.p3{left:87%;top:50%}.p4{left:76%;top:76%}.p5{left:50%;top:87%}.p6{left:24%;top:76%}.p7{left:13%;top:50%}.p8{left:24%;top:24%}.word{text-align:center;min-height:44px;font-size:1.65rem;font-weight:850;letter-spacing:.1em}.message{text-align:center;min-height:24px;font-weight:650;color:#766b5c}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.actions button{border:0;border-radius:11px;padding:12px 16px;font-weight:750;cursor:pointer}.primary{background:#25221e;color:#fff}.secondary{background:#ddd3c4}.found{margin:20px auto 0;background:#fff9;border-radius:15px;padding:15px;max-width:500px}.found h2{font-size:1rem;margin:0 0 8px}.words{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eee6da;border-radius:8px;padding:5px 8px}
</style></head><body><main class="app"><h1>Ordduellen</h1><p class="sub">Bygg ord av bokstäverna</p>
<div class="stats"><span class="pill">Hittade: <b id="score">0</b></span><span class="pill">Möjliga ord: <b id="possible">–</b></span></div>
<p class="hint">Bokstaven i mitten måste alltid användas</p><div id="board" class="board"></div><div id="word" class="word"></div><div id="message" class="message"></div>
<div class="actions"><button class="secondary" id="clear">Rensa</button><button class="primary" id="submit">Godkänn ord</button><button class="secondary" id="new">Ny spelplan</button></div>
<section class="found"><h2>Dina hittade ord</h2><div id="words" class="words">Inga ännu.</div></section></main>
<script>
const sets=["ARENSKILT","ORENSTADI","EKARSLUTN","INRETSKAL","ARBETSLIN"];let letters=[],selected=[],found=new Set();
const board=document.querySelector("#board"),word=document.querySelector("#word"),score=document.querySelector("#score"),words=document.querySelector("#words"),message=document.querySelector("#message");
function newBoard(){const s=sets[Math.floor(Math.random()*sets.length)].split("");const center=s.shift();s.sort(()=>Math.random()-.5);letters=[center,...s.slice(0,8)];selected=[];found.clear();message.textContent="";document.querySelector("#possible").textContent="–";render()}
function render(){board.innerHTML="";letters.forEach((l,i)=>{const b=document.createElement("button");b.className="tile p"+i+(i===0?" center":"")+(selected.includes(i)?" selected":"");b.textContent=l;b.onclick=()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else selected.push(i);message.textContent="";render()};board.appendChild(b)});word.textContent=selected.map(i=>letters[i]).join("");score.textContent=found.size;words.innerHTML=found.size?[...found].map(w=>'<span class="tag">'+w+'</span>').join(""):"Inga ännu."}
document.querySelector("#clear").onclick=()=>{selected=[];message.textContent="";render()};document.querySelector("#new").onclick=newBoard;
document.querySelector("#submit").onclick=()=>{const w=selected.map(i=>letters[i]).join("").toLowerCase();if(!selected.includes(0)){message.textContent="Mittenbokstaven måste vara med.";return}if(w.length<2){message.textContent="Välj minst två bokstäver.";return}if(found.has(w)){message.textContent="Det ordet har du redan hittat.";return}found.add(w);selected=[];message.textContent="Ord registrerat!";render()};newBoard();
</script></body></html>
