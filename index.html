<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ordduellen</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4efe4;color:#24211d;min-height:100vh;display:grid;place-items:center}.app{width:min(94vw,720px);padding:28px}h1{text-align:center;font-size:clamp(2.4rem,8vw,4.5rem);margin:0 0 4px}.sub{text-align:center;margin:0 0 24px;color:#655f55}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.pill{background:#fff;border:1px solid #d7cdbd;border-radius:999px;padding:8px 14px;font-weight:650}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:auto}.tile{aspect-ratio:1;border:0;border-radius:14px;background:#fff;box-shadow:0 3px 10px #0002;font-size:clamp(1.5rem,7vw,2.8rem);font-weight:800;cursor:pointer}.tile.selected{outline:4px solid #24211d;transform:translateY(-2px)}.word{text-align:center;font-size:1.5rem;font-weight:800;min-height:42px;margin:18px 0 10px;letter-spacing:.08em}.actions{display:flex;justify-content:center;gap:10px}.actions button{border:0;border-radius:10px;padding:12px 18px;font-weight:750;cursor:pointer}.primary{background:#24211d;color:white}.secondary{background:#ddd3c3}.found{max-width:520px;margin:20px auto 0;background:#fff8;padding:16px;border-radius:14px}.found h2{font-size:1rem;margin:0 0 8px}.words{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eee6d9;border-radius:8px;padding:5px 8px}
</style></head>
<body><main class="app"><h1>Ordduellen</h1><p class="sub">Hur många ord kan du hitta?</p>
<div class="stats"><span class="pill">Hittade: <b id="score">0</b></span><span class="pill">Möjliga ord: <b id="possible">–</b></span></div>
<div id="board" class="board"></div><div id="word" class="word"></div>
<div class="actions"><button class="secondary" id="clear">Rensa</button><button class="primary" id="submit">Godkänn ord</button><button class="secondary" id="new">Ny spelplan</button></div>
<section class="found"><h2>Dina hittade ord</h2><div id="words" class="words">Inga ännu.</div></section></main>
<script>
const sets=["STARENLIOKDMUÄGVRPÖTAHENS","KARINOSTELDMUGÄVREPOÅTNS","ORDENLISKATUMÄGVRPEÖHNS"];
let letters=[], selected=[], found=new Set();
const board=document.querySelector("#board"),word=document.querySelector("#word"),score=document.querySelector("#score"),words=document.querySelector("#words");
function newBoard(){letters=sets[Math.floor(Math.random()*sets.length)].slice(0,25).split("");letters.sort(()=>Math.random()-.5);selected=[];found.clear();render();document.querySelector("#possible").textContent="räknas…";setTimeout(()=>document.querySelector("#possible").textContent="—",500)}
function render(){board.innerHTML="";letters.forEach((l,i)=>{let b=document.createElement("button");b.className="tile"+(selected.includes(i)?" selected":"");b.textContent=l;b.onclick=()=>{if(!selected.includes(i))selected.push(i);render()};board.appendChild(b)});word.textContent=selected.map(i=>letters[i]).join("");score.textContent=found.size;words.innerHTML=found.size?[...found].map(w=>'<span class="tag">'+w+'</span>').join(""):"Inga ännu."}
document.querySelector("#clear").onclick=()=>{selected=[];render()};document.querySelector("#new").onclick=newBoard;
document.querySelector("#submit").onclick=()=>{let w=selected.map(i=>letters[i]).join("").toLowerCase();if(w.length>=2)found.add(w);selected=[];render()};newBoard();
</script></body></html>
