<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordduellen</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3efe7;color:#25221e}.app{width:min(94vw,620px);margin:auto;padding:28px 16px 50px}h1{text-align:center;font-size:clamp(2.6rem,10vw,4.5rem);margin:0}.sub{text-align:center;color:#70695f}.card{background:#fff;border-radius:18px;padding:20px;margin:20px 0;box-shadow:0 3px 14px #0001}.choice{display:grid;gap:10px;margin:18px 0}.choice label{border:2px solid #ddd3c4;border-radius:13px;padding:14px;font-weight:750}.choice input{margin-right:9px}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:1rem;cursor:pointer}.primary{background:#25221e;color:#fff}.secondary{background:#ddd3c4;color:#25221e;margin-top:9px}.join{display:flex;gap:8px;margin-top:9px}.join input{min-width:0;flex:1;padding:13px;border:1px solid #cfc5b5;border-radius:11px;font-size:16px;text-transform:uppercase}.hidden{display:none!important}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #d8cebf;border-radius:999px;padding:8px 13px;font-weight:700}.turn{text-align:center;font-weight:850;margin:13px}.board{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:auto}.tile{position:absolute;width:24%;aspect-ratio:1;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 12px #0002;font-size:clamp(1.6rem,7vw,2.5rem);font-weight:850;transform:translate(-50%,-50%)}.tile.center{background:#25221e;color:#fff}.tile.selected{outline:4px solid #8b7b66}.p0{left:50%;top:50%}.p1{left:50%;top:12%}.p2{left:80%;top:31%}.p3{left:80%;top:69%}.p4{left:50%;top:88%}.p5{left:20%;top:69%}.p6{left:20%;top:31%}.p7{left:50%;top:27%}.word{text-align:center;min-height:42px;font-size:1.6rem;font-weight:850;letter-spacing:.08em}.msg{text-align:center;min-height:25px;color:#70695f;font-weight:650}.actions{display:flex;gap:8px}.room{text-align:center;font-weight:800}.code{font-size:1.7rem;letter-spacing:.18em}</style></head>
<body><main class="app"><section id="home"><h1>Ordduellen</h1><p class="sub">Hitta orden. Utmana en vän.</p><div class="card"><h2>Välj spelläge</h2><div class="choice"><label><input type="radio" name="mode" value="solo" checked> Spela själv</label><label><input type="radio" name="mode" value="online"> Spela online</label></div><button id="start" class="btn primary">Starta spel</button><div id="onlineOptions" class="hidden"><button id="create" class="btn secondary">Skapa rum</button><div class="join"><input id="roomCode" maxlength="5" placeholder="RUMSKOD"><button id="join" class="btn primary">Anslut</button></div></div><div id="homeMsg" class="msg"></div></div></section>
<section id="game" class="hidden"><h1>Ordduellen</h1><div id="roomInfo" class="room hidden">Rum: <span id="code" class="code"></span></div><div class="stats"><span class="pill">Du: <b id="myScore">0</b></span><span class="pill">Motståndare: <b id="otherScore">0</b></span><span class="pill">Möjliga ord: <b>–</b></span></div><div id="turn" class="turn"></div><p class="sub">Mittenbokstaven måste användas · minst 4 bokstäver</p><div id="board" class="board"></div><div id="word" class="word"></div><div id="msg" class="msg"></div><div class="actions"><button id="clear" class="btn secondary">Rensa</button><button id="submit" class="btn primary">Lägg ord</button></div><button id="back" class="btn secondary">Till startsidan</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL="https://vihncukhitijhrvgvonw.supabase.co",SB_KEY="sb_publishable_cekFLm639kSdmlifG7YFWw_O-EFse4C",sb=supabase.createClient(SB_URL,SB_KEY);
const sets=["ARENSKIL","ORENSTAD","EKARSLUT","INRETSKA","ARBETSLI"];let letters=[],selected=[],room=null,player=1,channel=null,mode="solo",soloScore=0;
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),clientId=uid();let onlineSelected=false;
document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=()=>{$("onlineOptions").classList.toggle("hidden",x.value!=="online");onlineSelected=x.value==="online"});
function makeLetters(s){const a=[...s],center=a.shift();a.sort(()=>Math.random()-.5);return[center,...a.slice(0,7)]}
function showGame(){ $("home").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){const b=$("board");b.innerHTML="";letters.forEach((l,i)=>{const e=document.createElement("button");e.className="tile p"+i+(i===0?" center":"")+(selected.includes(i)?" selected":"");e.textContent=l;e.disabled=mode==="online"&&(!room||room.status!=="playing"||room.current_player!==player);e.onclick=()=>{selected.includes(i)?selected=selected.filter(x=>x!==i):selected.push(i);render()};b.appendChild(e)});$("word").textContent=selected.map(i=>letters[i]).join("");if(mode==="solo"){$("turn").textContent="Spela fritt";$("myScore").textContent=soloScore;$("otherScore").textContent="–"}else if(room){$("myScore").textContent=player===1?room.host_score:room.guest_score;$("otherScore").textContent=player===1?room.guest_score:room.host_score;$("turn").textContent=room.status==="waiting"?"Väntar på spelare 2…":room.current_player===player?"Din tur":"Motståndarens tur"}}
function localStart(){mode="solo";letters=makeLetters(sets[Math.floor(Math.random()*sets.length)]);soloScore=0;selected=[];showGame()}
$("start").onclick=()=>{const v=document.querySelector('input[name=mode]:checked').value;if(v==="solo")localStart();else{$("onlineOptions").classList.remove("hidden");$("homeMsg").textContent="Skapa ett rum eller skriv in en kod."}};
async function createRoom(){mode="online";player=1;letters=makeLetters(sets[Math.floor(Math.random()*sets.length)]);const code=Math.random().toString(36).slice(2,7).toUpperCase();const {data,error}=await sb.from("ordduellen_rooms").insert({code,host_id:clientId,letters:letters.join("")}).select().single();if(error){$("homeMsg").textContent="Kunde inte skapa rum.";return}room=data;openRoom();showGame()}
async function joinRoom(){const code=$("roomCode").value.trim().toUpperCase();const {data,error}=await sb.from("ordduellen_rooms").select("*").eq("code",code).single();if(error||!data){$("homeMsg").textContent="Rummet hittades inte.";return}if(data.guest_id){$("homeMsg").textContent="Rummet är fullt.";return}player=2;mode="online";const {data:updated,error:e}=await sb.from("ordduellen_rooms").update({guest_id:clientId,status:"playing"}).eq("id",data.id).is("guest_id",null).select().single();if(e||!updated){$("homeMsg").textContent="Kunde inte ansluta.";return}room=updated;letters=[...room.letters];openRoom();showGame()}
function openRoom(){letters=[...room.letters];$("roomInfo").classList.remove("hidden");$("code").textContent=room.code;if(channel)sb.removeChannel(channel);channel=sb.channel("ordduellen-"+room.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"ordduellen_rooms",filter:"id=eq."+room.id},p=>{room=p.new;letters=[...room.letters];selected=[];render()}).subscribe()}
$("create").onclick=createRoom;$("join").onclick=joinRoom;$("clear").onclick=()=>{selected=[];$("msg").textContent="";render()};
$("submit").onclick=async()=>{const w=selected.map(i=>letters[i]).join("").toLowerCase();if(!selected.includes(0)){$("msg").textContent="Mittenbokstaven måste vara med.";return}if(w.length<4){$("msg").textContent="Minst 4 bokstäver.";return}if(mode==="solo"){soloScore++;selected=[];$("msg").textContent=w.toUpperCase()+" registrerat";render();return}if(!room||room.current_player!==player)return;const patch={last_word:w,current_player:player===1?2:1};if(player===1)patch.host_score=room.host_score+1;else patch.guest_score=room.guest_score+1;const {data,error}=await sb.from("ordduellen_rooms").update(patch).eq("id",room.id).eq("current_player",player).select().single();if(error){$("msg").textContent="Kunde inte lägga ord.";return}room=data;selected=[];$("msg").textContent=w.toUpperCase()+" lagt. Turen går över.";render()};
$("back").onclick=()=>{if(channel){sb.removeChannel(channel);channel=null}$("game").classList.add("hidden");$("home").classList.remove("hidden");$("roomInfo").classList.add("hidden")};
</script></body></html>
